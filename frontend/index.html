<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Vehicle List</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

  <script>
    function checkAuth() {
      const role = sessionStorage.getItem("role");
      if (!role || role !== "OWNER") {
        window.location.replace("login.html");
      }
    }
    checkAuth();

    function logout() {
      sessionStorage.clear();
      window.location.replace("login.html");
    }
  </script>

  <style>
    .btn-renew {
      background-color: #2563eb;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .status-active { color: #16a34a; font-weight: bold; }
    .status-expired { color: #dc2626; font-weight: bold; }
    /* New style for Pending verification */
    .status-pending { color: #f59e0b; font-weight: bold; font-style: italic; }
  </style>
</head>

<body>
  <nav>
    <h2>Bluebook Renewal</h2>
    <a href="index.html" class="active"><i class="fas fa-car"></i> Vehicles</a>
    <a href="renewals.html"><i class="fas fa-history"></i> Renewal History</a>
    <a href="javascript:void(0)" onclick="logout()" style="margin-left:auto; color:red;">Logout</a>
  </nav>

  <main>
    <header>
      <h1>Registered Vehicles</h1>
      <a href="add_vehicle.html" class="btn-add">Add Vehicle</a>
    </header>

    <div class="stats-grid">
      <div class="stat-card">
        <h3>Total Vehicles</h3>
        <p id="totalCount">0</p>
      </div>
      <div class="stat-card">
        <h3>Active</h3>
        <p id="activeCount" style="color: #16a34a">0</p>
      </div>
      <div class="stat-card">
        <h3>Expired / Pending</h3>
        <p id="alertCount" style="color: #dc2626">0</p>
      </div>
    </div>

    <div class="card">
      <table>
        <thead>
          <tr>
            <th>Owner</th>
            <th>Plate No</th>
            <th>Type</th>
            <th>Expiry Date</th>
            <th>Status / Action</th>
          </tr>
        </thead>
        <tbody id="vehicleTable"></tbody>
      </table>
    </div>
  </main>

  <script>
    const user_id = sessionStorage.getItem("user_id");

    async function loadVehicles() {
      try {
        const res = await fetch(`/api/owner/vehicles?user_id=${user_id}`);
        const data = await res.json();
        const table = document.getElementById("vehicleTable");
        table.innerHTML = "";

        let total = data.length, active = 0, expired = 0;

        data.forEach(v => {
          const today = new Date();
          const expiry = new Date(v.expiry_date);
          const isExpired = expiry < today;

          let statusHtml = "";

          // Check for pending payment status first
          if (v.payment_status === 'PENDING') {
            statusHtml = `<span class="status-pending"><i class="fas fa-clock"></i> PENDING VERIFICATION</span>`;
            expired++; 
          } 
          else if (isExpired) {
            statusHtml = `<button onclick="goToPayment(${v.bluebook_id})" class="btn-renew">Renew Now</button>`;
            expired++;
          } 
          else {
            statusHtml = `<span class="status-active">ACTIVE</span>`;
            active++;
          }

          table.innerHTML += `
            <tr>
              <td>${v.full_name || "N/A"}</td>
              <td>${v.plate_no}</td>
              <td>${v.vehicle_type}</td>
              <td>${v.expiry_date ? v.expiry_date.split("T")[0] : "N/A"}</td>
              <td>${statusHtml}</td>
            </tr>
          `;
        });

        document.getElementById("totalCount").innerText = total;
        document.getElementById("activeCount").innerText = active;
        document.getElementById("alertCount").innerText = expired;
      } catch (err) {
        console.error("Error loading vehicles:", err);
      }
    }

    function goToPayment(bluebookId) {
      window.location.href = `payment.html?bluebook_id=${bluebookId}`;
    }

    loadVehicles();
  </script>
</body>
</html>
