<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Vehicle List</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

  <script>
    function checkAuth() {
      const role = sessionStorage.getItem("role");
      if (!role || role !== "OWNER") {
        window.location.replace("login.html");
      }
    }
    checkAuth();

    function logout() {
      sessionStorage.clear();
      window.location.replace("login.html");
    }
  </script>

  <style>
    .btn-renew {
      background-color: #2563eb;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
      margin-top: 5px;
    }

    .status-active {
      color: #16a34a;
      font-weight: bold;
    }

    .status-expired {
      color: #dc2626;
      font-weight: bold;
    }

    .status-pending {
      color: #b45309;
      background-color: #fef3c7;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: bold;
    }

    .status-cell {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 4px;
    }

    /* Fix alignment in the table */
    table th,
    table td {
      padding: 12px;
      text-align: left;
      vertical-align: middle;
      /* Centers content vertically */
    }

    .status-cell {
      display: flex;
      flex-direction: column;
      align-items: center;
      /* Centers items horizontally in the cell */
      justify-content: center;
      /* Centers items vertically */
      gap: 5px;
      min-height: 50px;
      /* Ensures consistent row height */
    }

    .btn-renew {
      background-color: #2563eb;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.8rem;
      transition: background 0.2s;
    }

    .btn-renew:hover {
      background-color: #1d4ed8;
    }

    .status-active,
    .status-expired,
    .status-pending {
      display: inline-block;
      text-align: center;
      width: 100%;
      /* Ensures text is centered relative to the column */
    }
  </style>
</head>

<body>
  <nav>
    <h2>Bluebook Renewal</h2>
    <a href="index.html" class="active"><i class="fas fa-car"></i> Vehicles</a>
    <a href="renewals.html"><i class="fas fa-history"></i> Renewal History</a>
    <a href="javascript:void(0)" onclick="logout()" style="margin-left:auto; color:red;">Logout</a>
  </nav>

  <main>
    <header>
      <h1>Registered Vehicles</h1>
      <a href="add_vehicle.html" class="btn-add">Add Vehicle</a>
    </header>

    <div class="stats-grid">
      <div class="stat-card">
        <h3>Total Vehicles</h3>
        <p id="totalCount">0</p>
      </div>
      <div class="stat-card">
        <h3>Active</h3>
        <p id="activeCount" style="color: #16a34a">0</p>
      </div>
      <div class="stat-card">
        <h3>Expired / Pending</h3>
        <p id="alertCount" style="color: #dc2626">0</p>
      </div>
    </div>

    <div class="card">
      <table>
        <thead>
          <tr>
            <th>Owner</th>
            <th>Plate No</th>
            <th>Type</th>
            <th>Expiry Date</th>
            <th>Status / Action</th>
          </tr>
        </thead>
        <tbody id="vehicleTable"></tbody>
      </table>
    </div>
  </main>

  <script>
    const user_id = sessionStorage.getItem("user_id");

    async function loadVehicles() {
      try {
        // Ensure this route matches the query we updated in owner.js
        const res = await fetch(`/api/owner/vehicles?user_id=${user_id}`);
        const data = await res.json();
        const table = document.getElementById("vehicleTable");
        table.innerHTML = "";

        let total = data.length, active = 0, expired = 0;

        data.forEach(v => {
  // 1. Get today's date in YYYY-MM-DD format (Standard SQL format)
  const todayStr = new Date().toISOString().split('T')[0]; 
  
  // 2. Get expiry date in YYYY-MM-DD format
  const expiryStr = v.expiry_date ? v.expiry_date.split("T")[0] : "";
  
  // 3. Simple String Comparison (Safe from timezone shifts)
  const isExpired = expiryStr < todayStr;

  let statusHtml = "";

  if (v.latest_payment_status === 'PENDING') {
    statusHtml = `<div class="status-cell"><span class="status-badge status-pending">PENDING</span></div>`;
    expired++; 
  } 
  else if (isExpired) {
    statusHtml = `
      <div class="status-cell">
        <span class="status-expired">EXPIRED</span>
        <button onclick="goToPayment(${v.bluebook_id})" class="btn-renew">Renew Now</button>
      </div>`;
    expired++;
  } 
  else {
    statusHtml = `<div class="status-cell"><span class="status-active">ACTIVE</span></div>`;
    active++;
  }

  table.innerHTML += `
    <tr>
      <td>${v.full_name || "N/A"}</td>
      <td><strong>${v.plate_no}</strong></td>
      <td>${v.vehicle_type}</td>
      <td>${expiryStr}</td> <td style="text-align: center;">${statusHtml}</td>
    </tr>
  `;
});

        document.getElementById("totalCount").innerText = total;
        document.getElementById("activeCount").innerText = active;
        document.getElementById("alertCount").innerText = expired;
      } catch (err) {
        console.error("Error loading vehicles:", err);
      }
    }

    function goToPayment(bluebookId) {
      window.location.href = `payment.html?bluebook_id=${bluebookId}`;
    }

    // Refresh every time the page is shown (useful for back-navigation)
    window.addEventListener('pageshow', loadVehicles);
    loadVehicles();
  </script>

</body>

</html>
