<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Vehicles - Bluebook</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin: 0 0 40px;
    }

    .stat-card {
      background: white;
      border-radius: 10px;
      padding: 18px 16px;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
      border: 1px solid #e5e7eb;
      transition: all 0.2s ease;
      text-align: center;
    }

    .stat-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.12);
    }

    .stat-card h3 {
      margin: 0 0 8px 0;
      font-size: 0.95rem;
      font-weight: 500;
      color: #6b7280;
    }

    .stat-value {
      margin: 0;
      font-size: 2.4rem;
      font-weight: 700;
      line-height: 1;
      color: #111827;
    }

    @media (max-width: 768px) {
      .stats-grid {
        grid-template-columns: 1fr;
      }
      .stat-value {
        font-size: 2.1rem;
      }
      .stat-card {
      padding: 16px 14px;
    }
    }
  </style>
</head>
<body>
  <nav>
    <h2>Bluebook Renewal</h2>
    <a href="index.html" class="active"><i class="fas fa-car"></i> Vehicles</a>
    <a href="renewals.html"><i class="fas fa-history"></i> History</a>
    <a href="javascript:void(0)" onclick="logout()" style="margin-top: auto; color: #f87171;"><i class="fas fa-sign-out-alt"></i> Logout</a>
  </nav>

  <main>
    <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
      <div>
        <h1>Registered Vehicles</h1>
        <p style="color: var(--text-muted);">Manage and monitor your vehicle records.</p>
      </div>
      <button onclick="location.href='add_vehicle.html'" style="width: auto; padding: 10px 24px;">+ Add Vehicle</button>
    </header>

    <div class="stats-grid">
      <div class="stat-card">
        <h3>Total Vehicles</h3>
        <p id="totalVehicles" class="stat-value">0</p>
      </div>

      <div class="stat-card">
        <h3>Active</h3>
        <p id="activeVehicles" class="stat-value" style="color: var(--primary, #2563eb);">0</p>
      </div>

      <div class="stat-card">
        <h3>Action Required</h3>
        <p id="actionRequired" class="stat-value" style="color: #ef4444;">0</p>
      </div>
    </div>

    <div class="card">
      <table>
        <thead>
          <tr>
            <th>Plate No</th>
            <th>Type</th>
            <th>Expiry Date</th>
            <th style="text-align: center;">Status</th>
          </tr>
        </thead>
        <tbody id="vehicleTable">
        </tbody>
      </table>
    </div>
  </main>

  <script>
    // Prevents the page from loading and crashing backend if session is null
    const user_id = sessionStorage.getItem("user_id");
    const role = sessionStorage.getItem("role");

    if (!user_id || user_id === "null" || role !== "OWNER") {
      window.location.replace("login.html");
    }

    async function loadDashboard() {
      try {
        const res = await fetch('/api/owner/stats'); 
        const data = await res.json();
        
        document.getElementById('totalVehicles').innerText = data.total || 0;
        document.getElementById('activeVehicles').innerText = data.active || 0;
        document.getElementById('actionRequired').innerText = data.pending || 0;
      } catch (err) {
        console.error("Error loading dashboard stats:", err);
      }
    }

    async function loadVehicles() {
      try {
        const res = await fetch(`/api/owner/vehicles?user_id=${user_id}`);
        
        if (!res.ok) {
            if (res.status === 400) window.location.replace("login.html");
            return;
        }

        const data = await res.json();
        const table = document.getElementById("vehicleTable");
        table.innerHTML = "";
        
        let counts = { total: data.length, active: 0, alert: 0 };
        const today = new Date().toISOString().split('T')[0];

        data.forEach(v => {
          const expiry = v.expiry_date ? v.expiry_date.split("T")[0] : "N/A";
          const isExpired = expiry !== "N/A" && expiry < today;
          let statusHtml = "";

          if (v.latest_payment_status === 'PENDING') {
            statusHtml = `<span style="color:#92400e; background:#fef3c7; padding:6px 14px; border-radius:20px; font-size:12px; font-weight:600; border: 1px solid #fde68a;">PENDING</span>`;
            counts.alert++;
          } 
          else if (isExpired || expiry === "N/A") {
            statusHtml = `<button onclick="window.location.href='payment.html?bluebook_id=${v.bluebook_id}'" 
                          style="padding:6px 16px; font-size:12px; width:auto; background: var(--primary);">Renew Now</button>`;
            counts.alert++;
          } 
          else {
            statusHtml = `<span style="color:#166534; background:#dcfce7; padding:6px 14px; border-radius:20px; font-size:12px; font-weight:600; border: 1px solid #bbf7d0;">ACTIVE</span>`;
            counts.active++;
          }

          table.innerHTML += `<tr>
            <td><strong>${v.plate_no}</strong></td>
            <td>${v.vehicle_type}</td>
            <td>${expiry}</td>
            <td style="text-align: center;">${statusHtml}</td>
          </tr>`;
        });

        document.getElementById("totalVehicles").innerText = counts.total;
        document.getElementById("activeVehicles").innerText = counts.active;
        document.getElementById("actionRequired").innerText = counts.alert;

      } catch (err) {
        console.error("Error loading vehicles:", err);
      }
    }

    function logout() { 
      sessionStorage.clear(); 
      window.location.replace("login.html"); 
    }

    // Load both on start
    loadDashboard();
    loadVehicles();
  </script>
</body>
</html>
