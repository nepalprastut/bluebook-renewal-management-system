<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add Vehicle - Bluebook</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
  <nav>
    <h2>Bluebook.</h2>
    <a href="index.html"><i class="fas fa-car"></i> Vehicles</a>
    <a href="renewals.html"><i class="fas fa-history"></i> History</a>
    <a href="javascript:void(0)" onclick="logout()" style="margin-top: auto; color: #f87171;"><i class="fas fa-sign-out-alt"></i> Logout</a>
  </nav>

  <main>
    <div style="max-width: 600px; margin: 0 auto;">
      <header style="margin-bottom: 30px;">
        <h1>Add New Vehicle</h1>
        <p style="color: var(--text-muted);">Register your vehicle to the system.</p>
      </header>

      <div class="card" style="padding: 32px;">
        <label>Plate Number</label>
        <input type="text" id="plate_no" placeholder="e.g., BA-2-PA-1234">

        <label>Vehicle Type</label>
        <select id="vehicle_type">
          <option value="">Choose Type</option>
          <option value="Bike">Bike</option>
          <option value="Scooter">Scooter</option>
          <option value="Car">Car</option>
          <option value="Truck">Truck</option>
        </select>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
          <div>
            <label>Engine No</label>
            <input type="text" id="engine_no" placeholder="Engine No">
          </div>
          <div>
            <label>Chassis No</label>
            <input type="text" id="chassis_no" placeholder="Chassis No">
          </div>
        </div>

        <label>Last Renewal Date</label>
        <input type="date" id="last_renewal">

        <button onclick="addVehicle()">Register Vehicle</button>
        <div id="msg" style="margin-top: 15px; text-align: center; font-weight: 500;"></div>
      </div>
    </div>
  </main>

  <script>
    function logout() { sessionStorage.clear(); window.location.replace("login.html"); }

    async function addVehicle() {
      const msg = document.getElementById("msg");
      const user_id = sessionStorage.getItem("user_id");
      
      const payload = {
        plate_no: plate_no.value,
        vehicle_type: vehicle_type.value,
        engine_no: engine_no.value,
        chassis_no: chassis_no.value,
        last_renewal_date: last_renewal.value
      };

      if (Object.values(payload).some(v => !v)) {
        msg.innerText = "Please fill all fields.";
        msg.style.color = "#dc2626";
        return;
      }

      const res = await fetch(`/api/vehicles?user_id=${user_id}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      if (res.ok) {
        msg.innerText = "Success! Redirecting...";
        msg.style.color = "#16a34a";
        setTimeout(() => location.href = "index.html", 1500);
      } else {
        const data = await res.json();
        msg.innerText = data.error || "Failed to add";
        msg.style.color = "#dc2626";
      }
    }
  </script>
</body>
</html>
