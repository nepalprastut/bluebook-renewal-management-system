<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Renewal History</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

<script>
  const user_id = sessionStorage.getItem("user_id");
  const role = sessionStorage.getItem("role");

  if (!user_id || role !== "OWNER") {
    window.location.replace("login.html");
  }

  function logout() {
    sessionStorage.clear();
    window.location.replace("login.html");
  }
</script>

<nav>
  <h2>Bluebook Renewal</h2>
  <a href="index.html"><i class="fas fa-car"></i> Vehicles</a>
  <a href="renewals.html" class="active"><i class="fas fa-history"></i> Renewal History</a>
  <a href="javascript:void(0)" onclick="logout()" style="margin-left:auto; color:red;">Logout</a>
</nav>

<main>
  <header>
    <h1>Bluebook Renewal History</h1>
  </header>

  <div class="card">
    <table>
      <thead>
        <tr>
          <th>Plate No</th>
          <th>Renewal Date</th>
          <th>Valid Period</th>
          <th>Amount</th>
          <th>Payment Status</th>
          <th>Method</th>
        </tr>
      </thead>
      <tbody id="renewalTable"></tbody>
    </table>
  </div>
</main>

<script>
function safeDate(d) {
  if (!d) return "-";
  return new Date(d).toLocaleDateString();
}

async function loadRenewals() {
  try {
    const res = await fetch(`/api/renewals?user_id=${user_id}`);
    const data = await res.json();

    const table = document.getElementById("renewalTable");
    table.innerHTML = "";

    if (!data.length) {
      table.innerHTML = `
        <tr>
          <td colspan="6" style="text-align:center;">
            No renewal history found.
          </td>
        </tr>
      `;
      return;
    }

    data.forEach(r => {
      const paymentStatus = r.payment_date ? "PAID" : "PENDING";

      table.innerHTML += `
        <tr>
          <td><strong>${r.plate_no}</strong></td>
          <td>${safeDate(r.renewal_date)}</td>
          <td>${safeDate(r.valid_from)} - ${safeDate(r.valid_to)}</td>
          <td>${r.amount ? "Rs. " + r.amount : "-"}</td>
          <td>
            <span class="status-pill ${paymentStatus}">
              ${paymentStatus}
            </span>
          </td>
          <td>${r.payment_method || "-"}</td>
        </tr>
      `;
    });

  } catch (err) {
    console.error(err);
    alert("Failed to load renewal history");
  }
}

loadRenewals();
</script>

</body>
</html>
