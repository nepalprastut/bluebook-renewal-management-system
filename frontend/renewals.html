<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Renewal History - Bluebook</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
  <nav>
    <h2>Bluebook.</h2>
    <a href="index.html"><i class="fas fa-car"></i> Vehicles</a>
    <a href="renewals.html" class="active"><i class="fas fa-history"></i> History</a>
    <a href="javascript:void(0)" onclick="logout()" style="margin-top: auto; color: #f87171;"><i class="fas fa-sign-out-alt"></i> Logout</a>
  </nav>

  <main>
    <header style="margin-bottom: 30px;">
      <h1>Renewal History</h1>
      <p style="color: var(--text-muted);">Track your past and pending renewal requests.</p>
    </header>

    <div class="card">
      <table class="history-table">
        <thead>
          <tr>
            <th>Date</th>
            <th>Plate No</th>
            <th>Amount</th>
            <th>Method</th>
            <th style="text-align: center;">Status</th>
          </tr>
        </thead>
        <tbody id="historyTable">
            </tbody>
      </table>
    </div>
  </main>

  <script>
    const user_id = sessionStorage.getItem("user_id");
    if (!user_id) window.location.replace("login.html");

    async function loadHistory() {
      try {
        const res = await fetch(`/api/renewals?user_id=${user_id}`);
        const data = await res.json();
        const table = document.getElementById("historyTable");
        table.innerHTML = "";

        if (data.length === 0) {
            table.innerHTML = `<tr><td colspan="5" style="padding: 40px; color: var(--text-muted);">No history found.</td></tr>`;
            return;
        }

        data.forEach(item => {
          const date = new Date(item.payment_date).toLocaleDateString();
          let statusClass = item.status === 'PENDING' ? 'pill-pending' : 
                            item.status === 'APPROVED' ? 'pill-approved' : 'pill-rejected';
          
          let rejectionMsg = (item.status === 'REJECTED' && item.rejection_reason) 
                             ? `<span class="rejection-text">Reason: ${item.rejection_reason}</span>` : '';

          table.innerHTML += `
            <tr>
              <td>${date}</td>
              <td><strong>${item.plate_no}</strong></td>
              <td>Rs. ${item.amount}</td>
              <td>${item.payment_method}</td>
              <td style="text-align: center;">
                <span class="status-pill ${statusClass}">${item.status}</span>
                ${rejectionMsg}
              </td>
            </tr>
          `;
        });
      } catch (err) {
        console.error("Error loading history:", err);
      }
    }

    function logout() { sessionStorage.clear(); window.location.replace("login.html"); }
    loadHistory();
  </script>
</body>
</html>
