<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Manage Prices - Admin</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
  <nav>
    <h2>Admin Portal</h2>
    <a href="admin.html"><i class="fas fa-chart-line"></i> Dashboard</a>
    <a href="admin_users.html"><i class="fas fa-users"></i> Manage Users</a>
    <a href="admin_officers.html"><i class="fas fa-user-tie"></i> Manage Officers</a>
    <a href="admin_prices.html" class="active"><i class="fas fa-tags"></i> Tax Rates</a>
    <a href="javascript:void(0)" onclick="logout()" style="margin-top: auto; color: #f87171;"><i class="fas fa-sign-out-alt"></i> Logout</a>
  </nav>

  <main>
    <header style="margin-bottom: 30px;">
        <a href="admin.html" class="back-link"><i class="fas fa-chevron-left"></i> Back to Hub</a>
        <h1 style="margin-top:10px;">Tax & Pricing Configuration</h1>
    </header>

    <div class="card">
        <h3>Update Vehicle Category Prices</h3>
        <p style="color: var(--text-muted); margin-bottom: 20px;">Changes made here will affect all future renewal calculations.</p>
        
        <table id="priceTable">
            <thead>
                <tr>
                    <th>Vehicle Type</th>
                    <th>Current Rate (NPR)</th>
                    <th>New Rate (NPR)</th>
                    <th style="text-align: right;">Action</th>
                </tr>
            </thead>
            <tbody id="priceList">
                </tbody>
        </table>
    </div>
  </main>

  <script>
    if (sessionStorage.getItem("role") !== "ADMIN") window.location.replace("login.html");

    async function loadPrices() {
      try {
        const res = await fetch('/api/admin/prices');
        const prices = await res.json();
        
        document.getElementById("priceList").innerHTML = prices.map(p => `
          <tr>
            <td><strong>${p.vehicle_type}</strong></td>
            <td>Rs. ${p.base_price}</td>
            <td>
              <input type="number" id="price_${p.id}" value="${p.base_price}" style="width: 120px; margin-bottom:0;">
            </td>
            <td style="text-align: right;">
              <button onclick="updatePrice(${p.id})" class="btn-primary" style="width:auto; padding: 8px 15px; font-size: 13px;">
                Update
              </button>
            </td>
          </tr>
        `).join('');
      } catch (err) { alert("Error loading prices"); }
    }

async function updatePrice(id) {
  const newPrice = document.getElementById(`price_${id}`).value;
  
  try {
    const res = await fetch(`/api/admin/update-price`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id, base_price: newPrice })
    });
    
    const result = await res.json();
    if (res.ok) {
      alert("Price updated successfully!");
      loadPrices(); // Refresh data
    } else {
      alert(result.error || "Update failed");
    }
  } catch (err) {
    alert("Could not connect to server");
  }
}

    loadPrices();
    function logout() { sessionStorage.clear(); window.location.replace("login.html"); }
  </script>
</body>
</html>
