<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Payment - Bluebook</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
  <nav>
    <h2>Bluebook.</h2>
    <a href="index.html"><i class="fas fa-car"></i> Vehicles</a>
    <a href="renewals.html"><i class="fas fa-history"></i> History</a>
    <a href="javascript:void(0)" onclick="logout()" style="margin-top: auto; color: #f87171;"><i class="fas fa-sign-out-alt"></i> Logout</a>
  </nav>

  <main>
    <div style="max-width: 500px; margin: 0 auto;">
      <header style="margin-bottom: 30px;">
        <h1>Secure Payment</h1>
        <p style="color: var(--text-muted);">Complete your renewal transaction.</p>
      </header>

      <div class="card" style="padding: 32px;">
        <div style="background: #f8fafc; padding: 20px; border-radius: 12px; margin-bottom: 24px;">
            <p style="font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; font-weight: 700;">Plate Number</p>
            <p id="display_plate" style="font-size: 1.2rem; font-weight: 700; margin-bottom: 15px;">Loading...</p>
            
            <p style="font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; font-weight: 700;">Amount Due</p>
            <p id="display_amount" style="font-size: 1.5rem; font-weight: 800; color: var(--primary);">Rs. 0.00</p>
        </div>

        <label>Payment Method</label>
        <select id="paymentMethod">
          <option value="Online">Online Banking / Wallet</option>
          <option value="Cash">Cash (Counter Visit)</option>
        </select>

        <button onclick="makePayment()" style="margin-top: 10px;">Confirm & Pay</button>
      </div>
    </div>
  </main>

  <div id="successModal" class="modal">
    <div class="modal-content">
      <div class="success-icon"><i class="fas fa-check-circle"></i></div>
      <h2>Payment Submitted!</h2>
      <p>An officer will verify your renewal within 24 hours. You can track progress in your history.</p>
      <button onclick="window.location.href='renewals.html'" style="width: auto; padding: 10px 30px;">Go to History</button>
    </div>
  </div>

 <script>
    // 1. Get the ID from the URL
    const params = new URLSearchParams(window.location.search);
    const bluebookId = params.get("bluebook_id");

    // 2. Guard: If no ID, send them back to the dashboard
    if (!bluebookId || bluebookId === "null" || bluebookId === "undefined") {
        console.error("No Bluebook ID provided in URL");
        window.location.replace("index.html");
    }

    async function loadInfo() {
        try {
            const res = await fetch(`/api/renewals/info/${bluebookId}`);
            
            if (!res.ok) throw new Error("Vehicle info not found");
            
            const data = await res.json();
            
            // Update the UI
            document.getElementById("display_plate").innerText = data.plate_no;
            document.getElementById("display_amount").innerText = `Rs. ${data.amount}`;
        } catch (err) {
            console.error("Error loading info:", err);
            document.getElementById("display_plate").innerText = "Error loading data";
        }
    }

    async function makePayment() {
        const btn = document.querySelector('button');
        btn.disabled = true;
        btn.innerText = "Processing...";

        try {
            const res = await fetch('/api/renewals/pay', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    bluebook_id: bluebookId,
                    payment_method: document.getElementById("paymentMethod").value
                })
            });

            const data = await res.json();

            if (res.ok) {
                document.getElementById("successModal").style.display = "block";
            } else {
                alert(data.error || "Payment failed");
                btn.disabled = false;
                btn.innerText = "Confirm & Pay";
            }
        } catch (err) {
            alert("Server error. Please try again.");
            btn.disabled = false;
            btn.innerText = "Confirm & Pay";
        }
    }

    function logout() { sessionStorage.clear(); window.location.replace("login.html"); }

    loadInfo();
</script>
</body>
</html>
