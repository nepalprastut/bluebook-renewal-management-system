<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Officer Setup - Admin</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
  <nav>
    <h2>Admin.</h2>
    <a href="admin.html"><i class="fas fa-chart-line"></i> Dashboard</a>
    <a href="admin_users.html"><i class="fas fa-users"></i> Manage Users</a>
    <a href="admin_officers.html" class="active"><i class="fas fa-user-tie"></i> Manage Officers</a>
    <a href="javascript:void(0)" onclick="logout()" style="margin-top: auto; color: #f87171;"><i class="fas fa-sign-out-alt"></i> Logout</a>
  </nav>

  <main>
    <header style="margin-bottom: 30px;">
        <a href="admin.html" class="back-link"><i class="fas fa-chevron-left"></i> Back to Dashboard</a>
        <h1 style="margin-top:10px;">Officer Management</h1>
        <p style="color: var(--text-muted);">Assign new credentials to departmental verification officers.</p>
    </header>

    <div class="card" style="max-width: 800px; margin: 0 auto; padding: 40px;">
        <div style="text-align: center; margin-bottom: 30px;">
            <div style="background: #f0fdf4; color: #16a34a; width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 15px; font-size: 24px;">
                <i class="fas fa-shield-alt"></i>
            </div>
            <h2>Register New Officer</h2>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 25px;">
            <div class="form-group">
                <label><i class="fas fa-id-badge"></i> Full Name</label>
                <input type="text" id="off_name" placeholder="E.g. Ramesh Thapa">
            </div>
            <div class="form-group">
                <label><i class="fas fa-briefcase"></i> Designation</label>
                <input type="text" id="off_desig" placeholder="E.g. Senior Inspector">
            </div>
            <div class="form-group">
                <label><i class="fas fa-user"></i> System Username</label>
                <input type="text" id="off_username" placeholder="officer_01">
            </div>
            <div class="form-group">
                <label><i class="fas fa-lock"></i> Access Password</label>
                <input type="password" id="off_password" placeholder="••••••••">
            </div>
        </div>

        <div style="margin-top: 35px; border-top: 1px solid #f1f5f9; padding-top: 25px;">
            <button onclick="createOfficer()" class="btn-primary" style="width: 100%; height: 50px; font-size: 16px;">
                <i class="fas fa-user-plus"></i> Create Officer Account
            </button>
            <p id="offMsg" style="margin-top: 20px; text-align: center; font-weight: 600; min-height: 24px;"></p>
        </div>
    </div>
  </main>
</body>
</html>
