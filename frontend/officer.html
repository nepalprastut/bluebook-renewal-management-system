<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Officer Dashboard - Bluebook Verification</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <script>
    if (sessionStorage.getItem("role") !== "OFFICER") window.location.replace("login.html");
    
    function logout() {
      sessionStorage.clear();
      window.location.replace("login.html");
    }
  </script>
  <style>
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      overflow-y: auto;
    }

    .modal-content {
      background: white;
      margin: 2% auto;
      padding: 30px;
      width: 60%;
      border-radius: 12px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
    }

    .detail-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin: 20px 0;
      padding: 15px 0;
      border-top: 1px solid #eee;
      border-bottom: 1px solid #eee;
    }

    /* REDESIGNED VERIFICATION BOX */
    .verify-box {
      background: #f8fafc;
      padding: 20px;
      border-radius: 10px;
      border: 1px solid #e2e8f0;
      margin-top: 15px;
    }

    .verify-box h4 {
      margin-bottom: 15px;
      color: #334155;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .check-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px;
      margin-bottom: 8px;
      background: white;
      border-radius: 8px;
      border: 1px solid #f1f5f9;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .check-item:hover {
      background: #f1f7ff;
      border-color: #3b82f6;
    }

    .check-item input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
      margin-top: 2px;
    }

    .check-item label {
      cursor: pointer;
      font-size: 0.95rem;
      color: #475569;
      line-height: 1.4;
      flex: 1;
    }

    .rejection-area {
      display: none;
      margin-top: 15px;
    }

    #rej_reason {
      width: 100%;
      padding: 10px;
      border: 1px solid #ffccd5;
      border-radius: 5px;
      background: #fff5f5;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .btn-reject {
      background: #dc2626;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 6px;
      cursor: pointer;
      flex: 1;
    }

    .btn-approve {
      background: #16a34a;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 6px;
      cursor: pointer;
      flex: 1;
    }

    .badge {
      background-color: #dc2626;
      color: white;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 0.75rem;
      margin-left: 5px;
      display: none;
    }
  </style>
</head>

<body>

  <nav>
    <h2>Officer Portal</h2>
    <a href="#" class="active">
      <i class="fas fa-tasks"></i> Pending Verification
      <span id="pendingBadge" class="badge">0</span>
    </a>
    <a href="javascript:void(0)" onclick="logout()" style="margin-left:auto; color:red;">
      <i class="fas fa-sign-out-alt"></i> Logout
    </a>
  </nav>

  <main>
    <header>
      <h1>Vehicle Renewal Requests</h1>
    </header>

    <div class="card">
      <table>
        <thead>
          <tr>
            <th>Plate No</th>
            <th>Owner Name</th>
            <th>Amount</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="paymentTable"></tbody>
      </table>
    </div>
  </main>

  <div id="inspectModal" class="modal">
    <div class="modal-content">
      <div style="display:flex; justify-content: space-between;">
        <h2 id="m_plate">Inspection</h2>
        <button onclick="closeModal()"
          style="border:none; background:none; font-size:1.5rem; cursor:pointer;">&times;</button>
      </div>

      <div class="detail-grid">
        <div>
          <h4><i class="fas fa-user"></i> Owner Info</h4>
          <p><strong>Name:</strong> <span id="m_owner"></span></p>
          <p><strong>Citizenship:</strong> <span id="m_citizen"></span></p>
          <p><strong>Mobile:</strong> <span id="m_mobile"></span></p>
        </div>
        <div>
          <h4><i class="fas fa-car"></i> Vehicle Specs</h4>
          <p><strong>Type:</strong> <span id="m_type"></span></p>
          <p><strong>Engine No:</strong> <span id="m_engine"></span></p>
          <p><strong>Chassis No:</strong> <span id="m_chassis"></span></p>
        </div>
      </div>

      <div class="verify-box">
        <h4><i class="fas fa-clipboard-check"></i> Verification Checklist</h4>
        
        <div class="check-item" onclick="document.getElementById('c1').click()">
          <input type="checkbox" id="c1" onclick="event.stopPropagation()">
          <label>Insurance documents match vehicle engine and chassis numbers.</label>
        </div>

        <div class="check-item" onclick="document.getElementById('c2').click()">
          <input type="checkbox" id="c2" onclick="event.stopPropagation()">
          <label>Tax amount matches government rates for this vehicle type.</label>
        </div>

        <div class="check-item" onclick="document.getElementById('c3').click()">
          <input type="checkbox" id="c3" onclick="event.stopPropagation()">
          <label>Plate number format is valid and registered in the central database.</label>
        </div>
      </div>

      <div id="rejectionArea" class="rejection-area">
        <label style="color: #dc2626;"><strong>Reason for Rejection:</strong></label>
        <textarea id="rej_reason" rows="3" placeholder="Explain why the request is being rejected..."></textarea>
        <button class="btn-reject" onclick="submitReject()" style="margin-top:10px;">Confirm Rejection</button>
      </div>

      <div class="btn-group" id="mainBtns">
        <button class="btn-approve" onclick="submitApprove()"><i class="fas fa-check-circle"></i> Approve
          Renewal</button>
        <button class="btn-reject" onclick="showRejection()"><i class="fas fa-times-circle"></i> Reject</button>
      </div>
    </div>
  </div>

  <script>
    let activeId = null;

    async function updateBadge() {
      const res = await fetch("/api/officer/pending-count");
      const data = await res.json();
      const badge = document.getElementById("pendingBadge");

      if (data.count > 0) {
        badge.innerText = data.count;
        badge.style.display = "inline-block";
      } else {
        badge.style.display = "none";
      }
    }

    async function loadPending() {
      try {
        const res = await fetch("/api/officer/pending");
        const data = await res.json();
        const table = document.getElementById("paymentTable");
        table.innerHTML = data.map(p => `
          <tr>
            <td><strong>${p.plate_no}</strong></td>
            <td>${p.full_name}</td>
            <td>Rs. ${p.amount}</td>
            <td><button class="btn-primary" onclick="openInspect(${p.payment_id})">Inspect</button></td>
          </tr>
        `).join('');
        updateBadge();
      } catch (err) {
        console.error("Error loading pending:", err);
      }
    }

    async function openInspect(id) {
      activeId = id;
      const res = await fetch(`/api/officer/details/${id}`);
      const p = await res.json();

      document.getElementById("m_plate").innerText = "Inspecting: " + p.plate_no;
      document.getElementById("m_owner").innerText = p.full_name;
      document.getElementById("m_citizen").innerText = p.citizenship_no;
      document.getElementById("m_mobile").innerText = p.mobile_no;
      document.getElementById("m_type").innerText = p.vehicle_type;
      document.getElementById("m_engine").innerText = p.engine_no;
      document.getElementById("m_chassis").innerText = p.chassis_no;

      // Reset UI
      document.getElementById("c1").checked = false;
      document.getElementById("c2").checked = false;
      document.getElementById("c3").checked = false;
      document.getElementById("rejectionArea").style.display = "none";
      document.getElementById("mainBtns").style.display = "flex";
      document.getElementById("inspectModal").style.display = "block";
    }

    function showRejection() {
      document.getElementById("rejectionArea").style.display = "block";
      document.getElementById("mainBtns").style.display = "none";
    }

    function closeModal() { document.getElementById("inspectModal").style.display = "none"; }

    async function submitApprove() {
      if (!document.getElementById("c1").checked || !document.getElementById("c2").checked || !document.getElementById("c3").checked) {
        return alert("Please check all verification boxes before approving.");
      }

      const res = await fetch(`/api/officer/approve/${activeId}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ officer_id: sessionStorage.getItem("user_id") })
      });
      if (res.ok) { alert("Approved!"); closeModal(); loadPending(); }
    }

    async function submitReject() {
      const reason = document.getElementById("rej_reason").value;
      if (!reason) return alert("Please provide a reason for rejection.");

      const res = await fetch(`/api/officer/reject/${activeId}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ officer_id: sessionStorage.getItem("user_id"), reason })
      });
      if (res.ok) { alert("Rejected!"); closeModal(); loadPending(); }
    }

    loadPending();
  </script>
</body>

</html>
