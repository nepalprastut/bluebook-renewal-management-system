<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>User Management - Admin</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    .btn-danger-outline {
        background: transparent;
        border: 1px solid #ef4444;
        color: #ef4444;
        padding: 8px 15px;
        border-radius: 6px;
        cursor: pointer;
        width: 100%;
        margin-top: 20px;
        transition: 0.3s;
    }
    .btn-danger-outline:hover {
        background: #ef4444;
        color: white;
    }
    .role-badge {
        font-size: 11px;
        padding: 2px 8px;
        border-radius: 12px;
        text-transform: uppercase;
        font-weight: bold;
        margin-left: 10px;
    }
    .badge-owner { background: #dcfce7; color: #166534; }
    .badge-officer { background: #fef3c7; color: #92400e; }
  </style>
</head>
<body>
  <nav>
    <h2>Admin.</h2>
    <a href="admin.html"><i class="fas fa-chart-line"></i> Dashboard</a>
    <a href="admin_users.html" class="active"><i class="fas fa-users"></i> Manage Users</a>
    <a href="admin_officers.html"><i class="fas fa-user-tie"></i> Manage Officers</a>
    <a href="javascript:void(0)" onclick="logout()" style="margin-top: auto; color: #f87171;"><i class="fas fa-sign-out-alt"></i> Logout</a>
  </nav>

  <main>
    <header style="margin-bottom: 30px;">
        <a href="admin.html" class="back-link"><i class="fas fa-chevron-left"></i> Back to Hub</a>
        <h1 style="margin-top:10px;">Global User Database</h1>
        <p style="color: var(--text-muted);">Search and manage Owners or Officers.</p>
    </header>

    <div class="card" style="padding: 25px; margin-bottom: 30px;">
        <div style="display: flex; gap: 15px;">
            <input type="text" id="searchUser" placeholder="Search username or full name..." style="flex: 1;">
            <button onclick="performSearch()" class="btn-primary" style="width: auto; padding: 0 30px;">Search</button>
        </div>
        <p id="errorMsg" style="color: red; margin-top: 10px;"></p>
    </div>

    <div id="resultArea" style="display: none;">
        <div style="display: grid; grid-template-columns: 320px 1fr; gap: 25px;">
            
            <div class="card" style="height: fit-content;">
                <div style="display: flex; align-items: center; justify-content: space-between;">
                    <h3 id="prof_name">User Name</h3>
                    <span id="prof_role" class="role-badge">ROLE</span>
                </div>
                <p id="prof_username" style="color: var(--text-muted); margin-bottom: 20px;">@username</p>
                <div id="profileDetails" class="profile-data"></div>
                
                <button id="deleteUserBtn" class="btn-danger-outline" onclick="deleteUser()">
                    <i class="fas fa-user-slash"></i> Delete Profile
                </button>
            </div>

            <div class="card" id="assetCard">
                <div style="display:flex; justify-content:space-between; margin-bottom:15px;">
                    <h3>Linked Assets</h3>
                    <span id="vehicleCount" class="nav-badge" style="position:static;">0 Found</span>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>Plate No</th>
                            <th>Type</th>
                            <th>Status</th>
                            <th style="text-align: right;">Action</th> 
                        </tr>
                    </thead>
                    <tbody id="vehicleList"></tbody>
                </table>
            </div>
            
            <div class="card" id="officerNote" style="display: none; justify-content: center; align-items: center; text-align: center;">
                <div>
                    <i class="fas fa-user-shield" style="font-size: 40px; color: var(--primary); margin-bottom: 15px;"></i>
                    <p style="color: var(--text-muted);">This user is registered as an Officer and does not have linked vehicle assets.</p>
                </div>
            </div>

        </div>
    </div>
  </main>

  <script>
    if (sessionStorage.getItem("role") !== "ADMIN") window.location.replace("login.html");

    let activeUserId = null;

    async function performSearch() {
      const query = document.getElementById("searchUser").value;
      const errorMsg = document.getElementById("errorMsg");
      const resultArea = document.getElementById("resultArea");

      if (!query) return;
      errorMsg.innerText = "";
      
      try {
        // Updated to the new global search endpoint
        const res = await fetch(`/api/admin/search-any-user?query=${query}`);
        const data = await res.json();
        
        if (!res.ok || data.length === 0) {
          errorMsg.innerText = "No user found with that name/username.";
          resultArea.style.display = "none";
          return;
        }

        // We take the first match for the detail view
        const user = data[0];
        activeUserId = user.user_id;

        // Update Profile Card
        document.getElementById("prof_name").innerText = user.full_name;
        document.getElementById("prof_username").innerText = `@${user.username}`;
        
        const roleSpan = document.getElementById("prof_role");
        roleSpan.innerText = user.role;
        roleSpan.className = `role-badge badge-${user.role.toLowerCase()}`;

        // Update Details based on role
        if (user.role === 'OWNER') {
            document.getElementById("profileDetails").innerHTML = `<p><strong>Mobile:</strong> ${user.mobile_no || 'N/A'}</p>`;
            document.getElementById("assetCard").style.display = "block";
            document.getElementById("officerNote").style.display = "none";
            loadOwnerVehicles(user.user_id);
        } else {
            document.getElementById("profileDetails").innerHTML = `<p><strong>Designation:</strong> ${user.designation || 'Staff'}</p>`;
            document.getElementById("assetCard").style.display = "none";
            document.getElementById("officerNote").style.display = "flex";
        }

        resultArea.style.display = "block";
      } catch (err) {
        errorMsg.innerText = "Connection error.";
      }
    }

    async function loadOwnerVehicles(userId) {
        // We reuse your existing search logic for specific owner assets
        const res = await fetch(`/api/admin/search-owner?username=${document.getElementById("prof_username").innerText.replace('@', '')}`);
        const data = await res.json();
        
        if (data.vehicles) {
            document.getElementById("vehicleCount").innerText = data.vehicles.length + " Found";
            document.getElementById("vehicleList").innerHTML = data.vehicles.map(v => `
              <tr>
                <td><strong>${v.plate_no}</strong></td>
                <td>${v.vehicle_type}</td>
                <td><span class="status-pill ${v.status==='ACTIVE'?'pill-approved':'pill-pending'}">${v.status || 'EXPIRED'}</span></td>
                <td style="text-align: right;">
                    <button class="btn-delete" onclick="deleteVehicle(${v.vehicle_id})">
                        <i class="fas fa-trash"></i>
                    </button>
                </td>
              </tr>
            `).join('');
        }
    }

    async function deleteUser() {
        if (!confirm("CRITICAL ACTION: Are you sure you want to delete this USER PROFILE? This will remove all their login access and profile data permanently.")) return;

        try {
            const res = await fetch(`/api/admin/users/${activeUserId}`, { method: 'DELETE' });
            if (res.ok) {
                alert("User profile deleted.");
                location.reload();
            } else {
                const err = await res.json();
                alert(err.error);
            }
        } catch (err) { alert("Server error."); }
    }

    async function deleteVehicle(vehicleId) {
        if (!confirm("Delete this vehicle record?")) return;
        try {
            const res = await fetch(`/api/admin/delete-vehicle/${vehicleId}`, { method: 'DELETE' });
            if (res.ok) { alert("Vehicle deleted."); performSearch(); }
        } catch (err) { alert("Error."); }
    }

    function logout() { sessionStorage.clear(); window.location.replace("login.html"); }
  </script>
</body>
</html>
