<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard - Bluebook</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin: 0 0 32px;
    }

    .stat-card {
      background: white;
      border-radius: 10px;
      padding: 18px 16px;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
      border: 1px solid #e5e7eb;
      transition: all 0.2s ease;
      text-align: center;
    }

    .stat-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
    }

    .stat-card h3 {
      margin: 0 0 8px 0;
      font-size: 0.95rem;
      font-weight: 500;
      color: #6b7280;
    }

    .stat-value {
      margin: 0;
      font-size: 2.4rem;
      font-weight: 700;
      line-height: 1;
      color: #111827;
    }

    @media (max-width: 768px) {
      .stats-grid {
        grid-template-columns: 1fr;
      }
      .stat-value {
        font-size: 2.1rem;
      }
      .stat-card {
        padding: 16px 14px;
      }
    }
  </style>
</head>
<body class="admin-body">

<nav>
    <h2>Officer Portal</h2>
    <div class="nav-section">
      <small>MAIN MENU</small>
      <a href="officer.html" class="active">
        <i class="fas fa-clipboard-list"></i> Pending Renewals
        <span id="pendingBadge" class="nav-badge" style="display:none;">0</span>
      </a>
      <a href="#" style="opacity: 0.7; cursor: not-allowed;">
        <i class="fas fa-book"></i> Vehicle Ledger
      </a>
      <a href="#" style="opacity: 0.7; cursor: not-allowed;">
        <i class="fas fa-file-invoice-dollar"></i> Generate Report
      </a>
    </div>

    <div class="nav-section" style="margin-top: 20px;">
      <small>SYSTEM</small>
      <a href="#" style="opacity: 0.7; cursor: not-allowed;">
        <i class="fas fa-user-circle"></i> My Profile
      </a>
      <a href="javascript:void(0)" onclick="logout()" style="color: #f87171;">
        <i class="fas fa-sign-out-alt"></i> Logout
      </a>
    </div>
</nav>

<main>
    <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
      <div>
        <h1>Verification Queue</h1>
        <p style="color: var(--text-muted);">Review and approve vehicle renewal requests.</p>
      </div>
      
      <div class="search-box" style="display: flex; gap: 10px;">
        <input type="text" id="lookupPlate" placeholder="Quick Plate Lookup..." style="padding: 10px; border-radius: 6px; border: 1px solid #ddd; width: 200px;">
        <button onclick="quickLookup()" class="btn-primary" style="width: auto; padding: 0 15px;"><i class="fas fa-search"></i></button>
      </div>
    </header>

    <div class="stats-grid" style="margin-bottom: 25px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px;">
        <div class="stat-card">
            <h3 style="font-size: 14px; color: var(--text-muted);">Queue Status</h3>
            <p id="statPending" style="font-size: 24px; font-weight: bold;">0</p>
            <span style="font-size: 12px; color: #f59e0b;">Awaiting Review</span>
        </div>
        <div class="stat-card">
            <h3 style="font-size: 14px; color: var(--text-muted);">Verified Today</h3>
            <p id="statToday" style="font-size: 24px; font-weight: bold; color: var(--primary);">0</p>
            <span style="font-size: 12px; color: #10b981;">Completed Tasks</span>
        </div>
        <div class="stat-card">
            <h3 style="font-size: 14px; color: var(--text-muted);">System Status</h3>
            <p style="font-size: 24px; font-weight: bold; color: #10b981;">ONLINE</p>
            <span style="font-size: 12px;">Server Node-01</span>
        </div>
    </div>

    </main>
  <script>
    if (sessionStorage.getItem("role") !== "ADMIN") window.location.replace("login.html");

    async function loadStats() {
      try {
        const res = await fetch('/api/admin/stats');
        const data = await res.json();

        const formattedRev = new Intl.NumberFormat('en-NP', {
          style: 'currency', 
          currency: 'NPR', 
          maximumFractionDigits: 0
        }).format(data.revenue || 0);

        document.getElementById("statRev").innerText = formattedRev;
        document.getElementById("statUsers").innerText = data.users || 0;
        document.getElementById("statPending").innerText = data.pending || 0;
      } catch (err) {
        console.error("Failed to load real stats:", err);
      }
    }

    function logout() { 
      sessionStorage.clear(); 
      window.location.replace("login.html"); 
    }

    loadStats();
  </script>
</body>
</html>
